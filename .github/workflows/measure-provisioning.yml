# Temporary. Measures item 6 of "To verify during planning" in
# docs/superpowers/specs/2026-11-23-repo-bot-design.md: a pinned Python runtime
# and a hash-checked, prebuilt-only, uncached install of PR-Agent on a
# GitHub-hosted runner. Holds no secrets, grants no permissions, uses no
# third-party actions. Removed again before the pull request is opened.
name: measure-provisioning

on:
  push:
    branches: [plan/v1-implementation]
    paths: [.github/workflows/measure-provisioning.yml]

permissions: {}

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    env:
      UV_VERSION: "0.11.32"
      UV_SHA256: aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967
      PY_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20260718/cpython-3.12.13%2B20260718-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz
      PY_SHA256: 5854aa6ec71cad00334d5065633c210b2e7feb40956767a59a91791cadcf0b79
      PR_AGENT_VERSION: "0.50.0"
    steps:
      - name: Measure
        shell: bash
        run: |
          set -euo pipefail
          now() { date +%s.%N; }
          since() { awk -v a="$1" -v b="$(now)" 'BEGIN { printf "%.1f", b - a }'; }
          work="$(mktemp -d "$RUNNER_TEMP/provision.XXXXXX")"
          cd "$work"
          # The install gets a new environment from an allow-list: no token, no key.
          clean() { env -i PATH="$work/uv:/usr/bin:/bin" HOME="$work/home" TMPDIR="$work/tmp" \
            UV_NO_CACHE=1 UV_NO_CONFIG=1 UV_PYTHON_DOWNLOADS=never "$@"; }
          mkdir -p home tmp uv

          t=$(now)
          curl -sSfL -o uv.tgz "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  uv.tgz" | sha256sum -c -
          tar xzf uv.tgz -C uv --strip-components=1
          t_uv=$(since "$t")

          t=$(now)
          curl -sSfL -o py.tgz "$PY_URL"
          echo "${PY_SHA256}  py.tgz" | sha256sum -c -
          tar xzf py.tgz
          t_py=$(since "$t")

          # Not part of the measured install: the real lockfile will be committed.
          echo "pr-agent[github]==${PR_AGENT_VERSION}" > req.in
          clean uv pip compile req.in --generate-hashes --only-binary :all: \
            --python "$work/python/bin/python3" -o req.lock -q
          packages=$(grep -c '==' req.lock)

          t=$(now)
          clean uv venv --python "$work/python/bin/python3" -q venv
          clean uv pip install --python venv/bin/python --require-hashes \
            --only-binary :all: -q -r req.lock
          t_install=$(since "$t")

          t=$(now)
          clean venv/bin/pr-agent --version > version.txt 2> first-run.log || true
          t_first=$(since "$t")
          t=$(now)
          clean venv/bin/pr-agent --version > /dev/null 2>&1 || true
          t_second=$(since "$t")

          size=$(du -sm venv | cut -f1)
          total=$(awk -v a="$t_uv" -v b="$t_py" -v c="$t_install" 'BEGIN { printf "%.1f", a + b + c }')
          {
            echo "| attempt | uv s | python s | install s | total s | first run s | second run s | packages | venv MB | version |"
            echo "|---|---|---|---|---|---|---|---|---|---|"
            echo "| ${{ matrix.attempt }} | $t_uv | $t_py | $t_install | $total | $t_first | $t_second | $packages | $size | $(tail -n 1 version.txt) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}; $(nproc) cpus"
